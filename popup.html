<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>X Usage</title>
  <style>
    /* Light xAI product UI — inverted from the dark marketing site.
       Tokens locked for differentiation from Claude/Cursor black popups. */
    @font-face {
      font-family: "Inter";
      src: url("fonts/Inter-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Inter";
      src: url("fonts/Inter-Medium.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("fonts/JetBrainsMono-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #E1E4E8;
      --surface: #FFFFFF;
      --border: rgba(10, 10, 10, 0.12);
      --border-btn: rgba(10, 10, 10, 0.25);
      --text: #0A0A0A;
      --text-85: rgba(10, 10, 10, 0.85);
      --text-muted: rgba(10, 10, 10, 0.55);
      --orange: #FF6308;
      --orange-08: rgba(255, 99, 8, 0.08);
      --steel-08: rgba(189, 201, 230, 0.1);
      --focus: #3B82F6;
      --accent: #FF6308;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --track: rgba(10, 10, 10, 0.08);
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", Menlo, ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      position: relative;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 400;
      color: var(--text);
      background: var(--bg);
      min-width: 300px;
      max-width: 300px;
      max-height: 560px;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* Ambient ignition wash — orange → steel at ~8% on light ground */
    body::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 120px;
      pointer-events: none;
      background: linear-gradient(
        105deg,
        var(--orange-08) 0%,
        var(--steel-08) 55%,
        transparent 100%
      );
      mask-image: linear-gradient(to bottom, black, transparent);
      -webkit-mask-image: linear-gradient(to bottom, black, transparent);
    }

    .shell {
      position: relative;
      z-index: 1;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .header-title {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .tier-pill {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 3px 8px;
      border-radius: 999px;
      background: transparent;
      border: 1px solid var(--border-btn);
      color: var(--text-muted);
    }

    .mono-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--accent);
      margin: 2px 0 10px;
    }

    .cycle-banner {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-85);
      line-height: 1.45;
      margin-bottom: 14px;
      letter-spacing: -0.01em;
    }

    .cycle-banner strong {
      color: var(--text);
      font-weight: 500;
    }

    .cycle-banner .countdown {
      display: block;
      margin-top: 2px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .section {
      margin-bottom: 14px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
    }

    .label {
      flex: 1 1 auto;
      min-width: 0;
      font-weight: 400;
      font-size: 11px;
      line-height: 1.35;
      letter-spacing: -0.015em;
      color: var(--text);
    }

    .value {
      flex: 0 0 auto;
      white-space: nowrap;
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 0.02em;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .bar-track {
      width: 100%;
      height: 3px;
      background: var(--track);
      border-radius: 0;
      overflow: hidden;
      border: none;
    }

    .bar-fill {
      height: 100%;
      border-radius: 0;
      transition: width 0.35s ease, background-color 0.35s ease;
      min-width: 0;
    }

    .reset-time {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 4px;
      text-align: right;
    }

    .extra-section {
      margin-top: 4px;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0;
      position: relative;
    }

    .pip {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--text);
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }
    .pip-tl { top: -1px; left: -1px; }
    .pip-tr { top: -1px; right: -1px; }
    .pip-bl { bottom: -1px; left: -1px; }
    .pip-br { bottom: -1px; right: -1px; }
    .extra-section:hover .pip { opacity: 1; }

    .extra-section.over-limit {
      background: rgba(239, 68, 68, 0.06);
      border-color: rgba(239, 68, 68, 0.35);
    }

    .extra-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .extra-label {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 400;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .pill {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 2px 7px;
      border-radius: 999px;
    }

    .pill-on {
      background: transparent;
      color: var(--green);
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .pill-off {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-btn);
    }

    .pill-neutral {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .pill-paused {
      background: transparent;
      color: var(--red);
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .extra-detail {
      font-size: 11px;
      color: var(--text-85);
      line-height: 1.5;
      letter-spacing: -0.01em;
    }

    .extra-detail strong {
      color: var(--text);
      font-weight: 500;
    }

    .extra-detail .over {
      color: var(--red);
      font-weight: 500;
    }

    .extra-sub {
      color: var(--text-muted);
      margin-top: 3px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.02em;
    }

    .extra-note {
      margin-top: 6px;
      color: var(--red);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .extra-bar-wrap {
      margin-top: 8px;
    }

    .footer {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .meta {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .refresh-btn {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border-btn);
      border-radius: 999px;
      padding: 5px 12px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .refresh-btn:hover {
      background: rgba(10, 10, 10, 0.05);
      border-color: rgba(10, 10, 10, 0.4);
    }
    .refresh-btn:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .refresh-btn:active { opacity: 0.75; }
    .refresh-btn:disabled { opacity: 0.5; cursor: default; }

    .error {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.03em;
      color: var(--red);
      margin-top: 8px;
    }

    .disclaimer {
      font-family: var(--font-mono);
      font-size: 8px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(10, 10, 10, 0.35);
      text-align: center;
      margin-top: 12px;
    }

    .empty {
      font-size: 11px;
      color: var(--text-muted);
      font-style: normal;
      text-align: left;
      padding: 4px 0 8px;
      letter-spacing: -0.01em;
    }

    .error-prompt {
      background: var(--surface);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 0;
      padding: 12px;
      margin-bottom: 14px;
    }

    .error-prompt-title {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 400;
      color: var(--red);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .error-prompt-body {
      font-size: 11px;
      color: var(--text-85);
      line-height: 1.5;
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }

    .error-prompt-body ol {
      margin: 6px 0 0 16px;
      padding: 0;
    }

    .error-prompt-body li {
      margin-bottom: 3px;
    }

    .error-prompt-body strong {
      color: var(--text);
      font-weight: 500;
    }

    .open-usage-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #FFFFFF;
      background: var(--text);
      border: 1px solid var(--text);
      border-radius: 999px;
      padding: 7px 14px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .open-usage-btn:hover { opacity: 0.85; }
    .open-usage-btn:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .open-usage-btn:active { opacity: 0.7; }

    .horizon {
      height: 1px;
      margin: 14px 0;
      background: linear-gradient(to right, transparent, rgba(10,10,10,0.35), transparent);
      opacity: 0.5;
    }

    .analytics-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 10px;
      margin: 0 0 12px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .analytics-summary .stat {
      min-width: 0;
    }

    .analytics-summary .stat-label {
      font-family: var(--font-mono);
      font-size: 8px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .analytics-summary .stat-value {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.01em;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .events-list {
      margin-top: 4px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .events-list-title {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .event-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      padding: 3px 0;
    }

    .event-row + .event-row {
      border-top: 1px solid rgba(10, 10, 10, 0.06);
    }

    .event-name {
      font-size: 11px;
      color: var(--text);
      letter-spacing: -0.01em;
      min-width: 0;
    }

    .event-meta {
      flex: 0 0 auto;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.02em;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }

    .event-meta strong {
      color: var(--text);
      font-weight: 400;
    }

    .events-zero {
      margin-top: 6px;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="shell">

  <div class="header">
    <span class="header-title">X Usage</span>
    <span class="tier-pill" id="tier-pill">—</span>
  </div>

  <div class="error-prompt" id="error-prompt" style="display:none;">
    <div class="error-prompt-title" id="error-prompt-title">Can't load usage</div>
    <div class="error-prompt-body" id="error-prompt-body"></div>
    <button class="open-usage-btn" id="open-usage-btn">Open console</button>
  </div>

  <div class="cycle-banner" id="cycle-banner" style="display:none;"></div>

  <div class="mono-tag" id="credits-heading" style="display:none;">[ Credits ]</div>
  <div class="extra-section" id="credits-section" style="display:none;">
    <span class="pip pip-tl" aria-hidden="true"></span>
    <span class="pip pip-tr" aria-hidden="true"></span>
    <span class="pip pip-bl" aria-hidden="true"></span>
    <span class="pip pip-br" aria-hidden="true"></span>
    <div class="extra-header">
      <span class="extra-label">Balance</span>
      <span id="credits-pill" class="pill pill-neutral">—</span>
    </div>
    <div class="extra-detail" id="credits-detail">Waiting for data…</div>
  </div>

  <div class="horizon" id="spend-horizon" style="display:none;"></div>

  <div class="mono-tag" id="spend-heading" style="display:none;">[ Spend ]</div>
  <div class="extra-section" id="spend-section" style="display:none;">
    <span class="pip pip-tl" aria-hidden="true"></span>
    <span class="pip pip-tr" aria-hidden="true"></span>
    <span class="pip pip-bl" aria-hidden="true"></span>
    <span class="pip pip-br" aria-hidden="true"></span>
    <div class="extra-header">
      <span class="extra-label">Billing cycle</span>
      <div>
        <span id="autorecharge-pill" class="pill pill-neutral">—</span>
      </div>
    </div>
    <div class="extra-detail" id="spend-detail">Waiting for data…</div>
    <div class="extra-bar-wrap" id="spend-bar-wrap" style="display:none;">
      <div class="bar-track" id="spend-bar-track" role="progressbar" aria-label="Billing cycle spend" aria-valuemin="0" aria-valuemax="100">
        <div class="bar-fill" id="spend-bar" style="width: 0%;"></div>
      </div>
      <div class="reset-time" id="spend-reset"></div>
    </div>
  </div>

  <div class="horizon" id="usage-horizon" style="display:none;"></div>

  <div class="mono-tag" id="usage-heading" style="display:none;">[ Usage ]</div>
  <div class="analytics-summary" id="analytics-summary" style="display:none;"></div>
  <div id="meters-slot"></div>
  <div class="events-list" id="events-list" style="display:none;"></div>

  <div class="footer">
    <span class="meta" id="meta-label">Waiting for data…</span>
    <button class="refresh-btn" id="refresh-btn">Refresh</button>
  </div>
  <div class="error" id="error-label" style="display:none;"></div>
  <div class="disclaimer">Unofficial — not affiliated with X Corp / Twitter / xAI</div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
